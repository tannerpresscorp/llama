name: Publish npm package

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish to npm
    uses: ./.github/workflow-templates/npm-publish.yml
    secrets: inherit
