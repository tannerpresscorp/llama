name: Windows Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Syntax smoke test
        shell: pwsh
        run: |
          python -m py_compile src\common.py src\build_dataset.py src\train_tokenizer.py src\pretrain.py src\evaluate.py scripts\convert_to_gguf.py scripts\test_api.py
