name: Dependency Review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5.0.0
        with:
          comment-summary-in-pr: always
