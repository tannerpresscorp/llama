name: Dependency Review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Review dependency changes
        id: dependency_review
        uses: actions/dependency-review-action@v5.0.0
        with:
          comment-summary-in-pr: always

      - name: Create issue when dependency review fails
        if: failure() && steps.dependency_review.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Dependency review failed for PR #${{ github.event.pull_request.number }}" \
            --body "$(cat <<'EOF'
          The dependency review workflow failed for pull request #${{ github.event.pull_request.number }}.

          Pull request: ${{ github.event.pull_request.html_url }}
          Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
          )"
