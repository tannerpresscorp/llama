seed: 42
model:
  hidden_size: 384
  intermediate_size: 1024
  num_hidden_layers: 6
  num_attention_heads: 6
  num_key_value_heads: 2
  max_position_embeddings: 1024
  rms_norm_eps: 1.0e-5
  rope_theta: 10000.0
  attention_bias: false
  mlp_bias: false
  tie_word_embeddings: false
  hidden_act: silu

tokenizer:
  vocab_size: 8192
  min_frequency: 2
  model_max_length: 1024

training:
  block_size: 512
  batch_size: 8
  gradient_accumulation_steps: 4
  learning_rate: 3.0e-4
  weight_decay: 0.1
  warmup_steps: 100
  max_steps: 3000
  eval_interval: 200
  eval_batches: 50
  save_interval: 500
  grad_clip: 1.0
  train_split: 0.98
  dtype: auto
